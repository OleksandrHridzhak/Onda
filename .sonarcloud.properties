# SonarCloud configuration for this repo
# Exclude generated and vendor artifacts from analysis/new code
sonar.exclusions=apps/**/build/**,packages/**/build/**,**/dist/**,**/node_modules/**,**/*.bundle.js,**/*.min.js,**/*.map,**/package-lock.json
sonar.coverage.exclusions=**/*.test.*,**/__tests__/**,apps/**/build/**,packages/**/build/**,**/dist/**,**/*.bundle.js,**/*.min.js,**/*.map,**/package-lock.json

# Exclude config files from duplication detection
sonar.cpd.exclusions=**/*.config.js,**/*.config.ts,**/webpack.config.js,**/eslint.config.js,**/.husky/commitlint.config.js,**/tailwind.config.js,**/tsconfig.json,**/package-lock.json,**/*.json

# Use main branch as reference for new code calculation
sonar.newCode.referenceBranch=main
